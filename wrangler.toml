# Cloudflare Worker config for the TrailHub tag + camera-name sync API.
# Deploy:  npx wrangler deploy
# First time, set the GitHub credentials as Worker secrets (run once):
#   npx wrangler secret put GITHUB_TOKEN     # fine-grained PAT, this repo, Contents: R/W
#   npx wrangler secret put GITHUB_OWNER     # e.g. lutzcalebDEV
#   npx wrangler secret put GITHUB_REPO      # e.g. Trailhub-2.0
# (Optional) npx wrangler secret put GITHUB_BRANCH   # defaults to "main"
#
# After deploy, copy the printed https://trailhub-tags.<you>.workers.dev URL into
# config.js  ->  window.TRAILHUB_TAGS_API = "https://trailhub-tags.<you>.workers.dev";

name = "trailhub-tags"
main = "tag-worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Starts the photo pull every 15 minutes (GitHub's own cron is throttled to a few
# runs a day). The token needs Actions: Read and write as well as Contents.
[triggers]
crons = ["*/15 * * * *"]

# Photo uploads. The password is a secret: npx wrangler secret put UPLOAD_PASSWORD
# Set R2_PUBLIC_BASE_URL to the URL from: npx wrangler r2 bucket dev-url enable trailhub-photos
[vars]
UPLOAD_USER = "valecrew"
R2_PUBLIC_BASE_URL = "https://pub-efcd649d08574ab882ee1e05ca5bd9b7.r2.dev"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "trailhub-photos"

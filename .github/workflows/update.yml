name: Update TrailHub

on:
  schedule:
    # GitHub treats this as best effort and has been running it only ~5 times a day.
    # Off-the-hour minutes dodge the busiest slots, but the dependable 5-minute
    # trigger is the Cloudflare cron in tag-worker.js (see the README).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # only for the weekly keep-alive commit

concurrency:
  group: trailhub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (saves the DeerCast forecast)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tesseract (temperature OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Pull photos and publish
        env:
          SPYPOINT_USERNAME: ${{ secrets.SPYPOINT_USERNAME }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          set -e
          # Nothing the site shows is kept in this public repo: data.js and the files
          # behind it live in the private R2 bucket, and the Worker serves them only
          # to signed-in people. Start from the latest saved state...
          python state_sync.py download

          # ...fetch new photos (pull.py only downloads ones it hasn't seen, tracked
          # in store.json, so re-running is cheap and idempotent)...
          python pull.py --limit 100

          # ...add optional AI labels (never allowed to stop new photos publishing)...
          python ai_tag.py || echo "::warning::AI tagging failed; photos still publish."
          python pull.py --rebuild

          # Save what DeerCast says today about the days ahead, once a day, so it can
          # later be checked against what the cameras saw.
          node deercast_log.mjs || echo "::warning::DeerCast log failed; photos still publish."

          # ...and save it. Only the photo job's own files; site edits are the Worker's.
          python state_sync.py upload

          # Push alerts compare with the data.js from before this run, so each
          # sighting alerts once. A failure here never fails the run.
          python push_alerts.py --before-file .prev-data.js || echo "::warning::Push alerts failed."

      - name: Keep the scheduled runs alive
        # GitHub pauses scheduled workflows in a repo with no commits for 60 days, and
        # the photo job no longer commits anything. Once a week it records the date.
        run: |
          f=.github/last-run
          now=$(date +%s)
          last=$(cat "$f" 2>/dev/null || echo 0)
          if [ $((now - last)) -lt 604800 ]; then exit 0; fi
          echo "$now" > "$f"
          git config user.name "trailhub-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Weekly keep-alive"
          git pull --rebase --quiet origin main && git push origin HEAD:main || echo "::warning::Keep-alive push failed."

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Vale Trails — a clean, intuitive dashboard for your SPYPOINT trail cameras: gallery, movement insights, map and species review." />
  <meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)" />
  <title>Vale Trails</title>

  <!-- Installable app: manifest + icons. iOS reads the apple-* tags, everything else the manifest. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vale Trails" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Set theme before paint to avoid a flash of the wrong palette. -->
  <script>
    try {
      var t = localStorage.getItem("trailhub-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Design system -->
  <link rel="stylesheet" href="app/styles.css" />

  <!-- Leaflet 1.9.4, vendored like React (map tiles still need the network). -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot__inner">
        <div class="boot__mark">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2.5 19 5.5-9 3 4.5L18 7l3.5 12Z" />
          </svg>
        </div>
        <div class="muted">Loading Vale Trails…</div>
      </div>
    </div>
  </div>

  <!-- Site config + generated capture data (define globals before the app boots). -->
  <script src="config.js"></script>
  <script src="data.js"></script>

  <!-- Vendored React + htm (no build step; works on GitHub Pages over plain http). -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>

  <!-- Leaflet runtime -->
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- Application (ES modules) -->
  <script type="module" src="app/main.js"></script>

  <!-- Offline shell + "Add to Home Screen". Skipped when opened from a file. -->
  <script>
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>

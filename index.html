<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Vale Trails — a clean, intuitive dashboard for your SPYPOINT trail cameras: gallery, movement insights, map and species review." />
  <meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)" />
  <title>Vale Trails</title>

  <!-- Installable app: manifest + icons. iOS reads the apple-* tags, everything else the manifest. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vale Trails" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- iPhone launch screens: the dark background and logo instead of a white flash
       while the Home Screen app starts. One per screen size; icons/splash. -->
<link rel="apple-touch-startup-image" href="icons/splash/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/launch-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  <!-- Set theme before paint to avoid a flash of the wrong palette. -->
  <script>
    try {
      // "dark" (the default), "light", or "auto" to follow the phone's own setting.
      var t = localStorage.getItem("trailhub-theme") || "dark";
      if (t === "auto") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      t = t === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      // The browser's bars take the app's colour, not the phone's light or dark setting.
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", t === "light" ? "#f6f7f6" : "#0f1211");
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>

  <!-- Fonts -->
  <!-- iPhones and iPads use their own system font (styles.css, "iPhone type"): it's
       what every other app on the phone uses, and there's nothing to download on a
       weak signal. Everything else loads Inter, without blocking the first paint. -->
  <script>
    (function () {
      var apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (apple) { document.documentElement.classList.add("apple-type"); return; }
      var add = function (rel, href, cross) {
        var l = document.createElement("link");
        l.rel = rel; l.href = href;
        if (cross) l.crossOrigin = "";
        document.head.appendChild(l);
        return l;
      };
      add("preconnect", "https://fonts.googleapis.com");
      add("preconnect", "https://fonts.gstatic.com", true);
      add("stylesheet", "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
    })();
  </script>

  <!-- The files the app starts with, fetched together instead of one after another.
       Keep in step with what app/main.js imports (pages load on their own). -->
  <link rel="modulepreload" href="app/main.js" />
  <link rel="modulepreload" href="app/react.js" />
  <link rel="modulepreload" href="app/core.js" />
  <link rel="modulepreload" href="app/analytics.js" />
  <link rel="modulepreload" href="app/shell.js" />
  <link rel="modulepreload" href="app/ui.js" />
  <link rel="modulepreload" href="app/icons.js" />
  <link rel="modulepreload" href="app/upload.js" />
  <link rel="modulepreload" href="app/login.js" />
  <link rel="modulepreload" href="app/comments.js" />
  <link rel="modulepreload" href="app/account.js" />
  <link rel="modulepreload" href="app/alerts.js" />
  <link rel="modulepreload" href="app/faceid.js" />
  <link rel="modulepreload" href="app/install.js" />
  <link rel="modulepreload" href="app/views/overview.js" />
  <link rel="modulepreload" href="app/deercast.js" />
  <link rel="modulepreload" href="app/exif.js" />
  <link rel="modulepreload" href="app/views/castcard.js" />

  <!-- Design system -->
  <link rel="stylesheet" href="app/styles.css" />

  <!-- Leaflet 1.9.4 is vendored and loaded by the Map tab when it first opens
       (app/views/mapview.js), so it isn't parsed on every start. -->
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot__inner">
        <div class="boot__mark">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2.5 19 5.5-9 3 4.5L18 7l3.5 12Z" />
          </svg>
        </div>
        <div class="muted">Loading Vale Trails…</div>
      </div>
    </div>
  </div>

  <!-- Site config (the Worker's address). The photos and everything else are
       private: the app fetches them from the Worker after signing in. -->
  <script src="config.js"></script>

  <!-- Vendored React + htm (no build step; works on GitHub Pages over plain http). -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>

  <!-- Application (ES modules) -->
  <script type="module" src="app/main.js"></script>

  <!-- Offline shell + "Add to Home Screen". Skipped when opened from a file. -->
  <script>
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
